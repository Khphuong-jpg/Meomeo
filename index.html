<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mèo Con Hứng Kẹo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe6f2, #e6f7ff);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    overflow: hidden;
  }
  canvas {
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(214, 51, 108, 0.2);
    max-width: 95vw;
    max-height: 95vh;
    width: auto;
    height: auto;
    aspect-ratio: 480 / 640;
    touch-action: none;
    background: #fff;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 640;
  canvas.width = W;
  canvas.height = H;

  let state = 'start'; // start, playing, gameover
  let score = 0;
  let lives = 3;
  let items = [];
  let spawnTimer = 0;
  let spawnInterval = 900; // ms
  let lastTime = 0;
  let targetX = null;

  const player = {
    x: W / 2,
    y: H - 80,
    width: 70,
    height: 70,
    speed: 600
  };

  const keys = { left: false, right: false };

  function startGame() {
    state = 'playing';
    score = 0;
    lives = 3;
    items = [];
    spawnTimer = 0;
    spawnInterval = 900;
    player.x = W / 2;
    targetX = null;
    lastTime = 0;
  }

  const EMOJIS = ['🍓', '🍰', '🍬', '🌸', '⭐', '🧁', '🍭', '🍩', '🍪'];

  function spawnItem() {
    const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const size = 36 + Math.random() * 16;
    items.push({
      x: size + Math.random() * (W - size * 2),
      y: -size,
      vy: 120 + Math.random() * 80 + score * 2,
      emoji,
      size,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 2
    });
  }

  function update(dt) {
    if (state !== 'playing') return;

    if (keys.left) {
      player.x -= player.speed * dt;
      targetX = null;
    }
    if (keys.right) {
      player.x += player.speed * dt;
      targetX = null;
    }
    if (targetX !== null) {
      player.x += (targetX - player.x) * Math.min(1, 10 * dt);
    }
    player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));

    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnItem();
      spawnInterval = Math.max(400, spawnInterval - 10);
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.rotation += it.rotSpeed * dt;

      const dx = Math.abs(it.x - player.x);
      const dy = Math.abs(it.y - player.y);
      if (dy < player.height / 2 + it.size / 2 && dx < player.width / 2 + it.size / 2) {
        score++;
        items.splice(i, 1);
        continue;
      }

      if (it.y > H + 50) {
        items.splice(i, 1);
        lives--;
        if (lives <= 0) {
          state = 'gameover';
        }
      }
    }
  }

  function drawCloud(x, y, size) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
    ctx.arc(x + size * 0.5, y - size * 0.2, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 1.0, y, size * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawOverlay(title, buttonText, subtitle) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#d6336c';
    ctx.font = 'bold 36px "Comic Sans MS", cursive, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, W / 2, H / 2 - 100);

    ctx.font = '20px "Comic Sans MS", cursive, sans-serif';
    ctx.fillStyle = '#666';
    ctx.fillText(subtitle, W / 2, H / 2 - 40);

    const btnW = 180, btnH = 60;
    const btnX = W / 2 - btnW / 2, btnY = H / 2 + 40;

    ctx.fillStyle = '#ff8fab';
    roundRect(ctx, btnX, btnY, btnW, btnH, 30);
    ctx.fill();

    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px "Comic Sans MS", cursive, sans-serif';
    ctx.fillText(buttonText, W / 2, btnY + btnH / 2 + 2);
  }

  function draw() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#ffe6f2');
    grad.addColorStop(1, '#e6f7ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawCloud(80, 100, 60);
    drawCloud(350, 180, 50);
    drawCloud(200, 60, 40);

    items.forEach(it => {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rotation);
      ctx.font = `${it.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.emoji, 0, 0);
      ctx.restore();
    });

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.font = '70px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🧺', 0, 20);
    ctx.font = '50px serif';
    ctx.fillText('😺', 0, -20);
    ctx.restore();

    ctx.fillStyle = '#d6336c';
    ctx.font = 'bold 24px "Comic Sans MS", cursive, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`Điểm: ${score}`, 20, 40);

    ctx.textAlign = 'right';
    ctx.fillText('❤️'.repeat(Math.max(0, lives)), W - 20, 40);

    if (state === 'start') {
      drawOverlay('Mèo Con Hứng Kẹo', 'Bắt đầu', 'Dùng chuột, chạm hoặc phím ← → để di chuyển');
    } else if (state === 'gameover') {
      drawOverlay('Hết lượt rồi!', 'Chơi lại', `Điểm của bạn: ${score}`);
    }
  }

  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointermove', (e) => {
    if (state !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const x = (e.clientX - rect.left) * scaleX;
    targetX = Math.max(player.width / 2, Math.min(W - player.width / 2, x));
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') {
      startGame();
    } else {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const x = (e.clientX - rect.left) * scaleX;
      targetX = Math.max(player.width / 2, Math.min(W - player.width / 2, x));
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
      keys.left = true;
      targetX = null;
      e.preventDefault();
    }
    if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
      keys.right = true;
      targetX = null;
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'Left' || e.key === 'a' || e.key === 'A') {
      keys.left = false;
    }
    if (e.key === 'ArrowRight' || e.key === 'Right' || e.key === 'd' || e.key === 'D') {
      keys.right = false;
    }
  });

  requestAnimationFrame(loop);
</script>
</body>
</html>
